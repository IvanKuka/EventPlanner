name: Desktop build

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release version (MAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Package ${{ matrix.rid }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: osx-arm64
            os: macos-26
          # Native Intel runner; verify label availability and deprecations before each release.
          - rid: osx-x64
            os: macos-26-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      VERSION: ${{ inputs.version || '0.0.0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore --locked-mode
      - name: Test
        run: dotnet test --configuration Release --no-restore

      - name: Publish
        shell: pwsh
        run: ./build/publish.ps1 -Rid ${{ matrix.rid }} -Version $env:VERSION

      - name: Smoke test (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: ./build/smoke-test.ps1 -Executable artifacts/publish/win-x64/EventPlanner.exe

      - name: Package (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
          ./build/package-windows.ps1 -Version $env:VERSION

      - name: Package (macOS)
        if: startsWith(matrix.rid, 'osx-')
        run: |
          chmod +x build/package-macos.sh
          build/package-macos.sh ${{ matrix.rid }} "$VERSION"

      - name: Smoke test (macOS bundle)
        if: startsWith(matrix.rid, 'osx-')
        shell: pwsh
        run: ./build/smoke-test.ps1 -Executable artifacts/staging/${{ matrix.rid }}/EventPlanner.app/Contents/MacOS/EventPlanner

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.rid }}
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 14
